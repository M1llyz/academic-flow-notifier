services:
  n8n:
    image: n8nio/n8n:latest
    container_name: academic-flow-n8n
    ports:
      - "5678:5678"
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ./data/outputs:/home/node/.n8n-files/outputs
      - ./data/inputs:/home/node/.n8n-files/inputs
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo

  academic-flow-python:
    build: .
    container_name: academic-flow-python
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"